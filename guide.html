<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ガイド - EN-KAI</title>
    <link rel="stylesheet" href="style.css">
    <script type="module">
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        onAuthStateChanged(getAuth(), (user) => {
            const userStatus = document.getElementById('user-status');
            if (userStatus) userStatus.innerText = user ? user.displayName : "ゲスト";
        });
    </script>
</head>
<body>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<nav id="side-menu" class="side-menu">
    <div style="padding: 10px; text-align: center; border-bottom: 1px solid var(--card-border);">
        <div id="user-status" style="font-weight: 900;">ゲスト</div>
    </div>
    <div class="menu-links">
        <a href="index.html">🏠 ホーム</a>
        <a href="index.html?screen=start-screen">🚀 宴会を開始</a>
        <a href="index.html?screen=share-screen">💡 お題を共有する</a>
        <a href="guide.html">📖 使い方</a>
        <a href="profile.html">👤 作成者について</a>
        <a href="index.html?screen=report-screen">📊 自分のレポート</a>
        <a href="#" onclick="handleLogout(); return false;" style="color:var(--accent-red); margin-top:20px;">🚪 ログアウト</a>
        <a href="#" onclick="toggleMenu(); return false;">❌ 閉じる</a>
    </div>
</nav>

<header class="glass-header">
    <div class="header-inner">
        <a href="index.html" class="logo"><div class="logo-icon">E</div><span>EN-KAI</span></a>
        <button class="menu-trigger" onclick="toggleMenu()">MENU</button>
    </div>
</header>

<main class="container">
    <div class="screen">
        <h1 style="text-align: center; font-weight: 900; margin: 20px 0;">📖 使い方ガイド</h1>
        <div class="card"><h3>1. 宴会をはじめる</h3><p>トップの「宴会を開始する」からシーンを選択。お題がランダムでセットされます。</p></div>
        <div class="card"><h3>2. 実績をためる</h3><p>Googleログインをしてから宴会を終えると、盛り上げた回数がランキングに反映されます。</p></div>
        <div class="card"><h3>3. お題を共有する</h3><p>メニューの「お題を共有する」から、あなた独自の盛り上がるテーマをみんなに共有しましょう！</p></div>
        <button class="btn-primary" onclick="location.href='index.html'">ホームへ戻る</button>
    </div>
</main>
<script src="script.js"></script>
</body>
</html>
