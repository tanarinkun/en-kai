<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EN-KAI</title>
    <link rel="stylesheet" href="style.css">
    <script type="module">
        /* Firebase設定（省略なし） */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, where, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        const firebaseConfig = {
            apiKey: "AIzaSyCdFdzVaqfdHPEQH-iS-ufcV629EMt6k6g", authDomain: "en-ka1.firebaseapp.com",
            projectId: "en-ka1", storageBucket: "en-ka1.firebasestorage.app",
            messagingSenderId: "390713740088", appId: "1:390713740088:web:139bde844b5bedb1218fcd"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        window.db = db; window.auth = auth;
        window.dbMethods = { addDoc, collection, getDocs, query, orderBy, where, limit };
        window.authMethods = { signInWithPopup, provider, signOut };

        onAuthStateChanged(auth, (user) => {
            const userStatusElements = document.querySelectorAll('.dynamic-user-status');
            userStatusElements.forEach(el => {
                el.innerText = user ? user.displayName : "ゲスト";
            });
            if (user) {
                document.getElementById('login-section').style.display = 'none';
                loadDashboardData();
            } else {
                document.getElementById('login-section').style.display = 'block';
            }
        });
    </script>
</head>
<body>

<div id="toast-notification" class="toast-banner">✅ 完了しました</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<nav id="side-menu" class="side-menu">
    <div style="padding: 10px; text-align: center; border-bottom: 1px solid var(--card-border);">
        <div class="dynamic-user-status" style="font-weight: 900;">読み込み中...</div>
    </div>
    <div class="menu-links">
        <a href="index.html">🏠 ホーム</a>
        <a href="#" onclick="showScreen('start-screen'); return false;">🚀 宴会を開始</a>
        <a href="#" onclick="showScreen('share-screen'); return false;">💡 お題を共有する</a>
        <a href="guide.html">📖 使い方</a>
        <a href="profile.html">👤 作成者について</a>
        <a href="#" onclick="showReport(); return false;">📊 自分のレポート</a>
        <a href="#" onclick="handleLogout(); return false;" style="color:var(--accent-red); margin-top:20px;">🚪 ログアウト</a>
        <a href="#" onclick="toggleMenu(); return false;">❌ 閉じる</a>
    </div>
</nav>

<header class="glass-header">
    <div class="header-inner">
        <a href="index.html" class="logo"><div class="logo-icon">E</div><span>EN-KAI</span></a>
        <div class="header-controls">
            <button class="mode-toggle-btn" onclick="toggleDarkMode()">🌓</button>
            <button class="menu-trigger" onclick="toggleMenu()">MENU</button>
        </div>
    </div>
</header>

<main class="container">
    <section id="welcome-screen" class="screen">
        <div class="card" style="text-align:center; padding: 3rem 1.5rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
            <h1 style="font-weight:900;">EN-KAI</h1>
            <p style="color:var(--text-sub); margin-bottom: 2rem;">沈黙を最高の笑顔へ。</p>
            <button class="btn-primary" onclick="showScreen('start-screen')">宴会を開始する</button>
        </div>
        <div id="login-section" class="card" style="text-align:center; border: 2px dashed var(--primary);">
            <button class="btn-secondary" onclick="handleLogin()">Googleログイン</button>
        </div>
        <div class="card">
            <h3>🏆 ランキング</h3>
            <div id="ranking-list"></div>
        </div>
    </section>

    <section id="start-screen" class="screen" style="display:none">
        <div class="card">
            <h2 style="font-weight:900;">シーンを選択</h2>
            <div class="mode-selector">
                <div class="mode-option">
                    <input type="radio" name="mode" value="icebreak" id="m1" checked>
                    <label for="m1" class="mode-label">🧊 <div><b>アイスブレイク</b></div></label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" value="casual" id="m2">
                    <label for="m2" class="mode-label">🍺 <div><b>カジュアル</b></div></label>
                </div>
                <div class="mode-option">
                    <input type="radio" name="mode" value="business" id="m3">
                    <label for="m3" class="mode-label">💼 <div><b>ビジネス</b></div></label>
                </div>
            </div>
            <button class="btn-primary" style="margin-top:20px;" onclick="onStartClicked()">開始！</button>
        </div>
    </section>

    <section id="main-screen" class="screen" style="display:none">
        <div class="card">
            <div id="timer-display">01:00</div>
            <div class="timer-bar-bg"><div id="timer-bar-fill"></div></div>
            <button id="timer-start-btn" class="btn-primary" onclick="toggleTimer()">スタート</button>
        </div>
        <div class="card topic-card"><div id="topic-text">準備中...</div></div>
        <button class="btn-primary" onclick="nextTopic()">次へ ≫</button>
        <button class="btn-secondary" style="color:var(--accent-red); margin-top:10px;" onclick="handleFinishClick()">🛑 終了</button>
    </section>

    <section id="finish-screen" class="screen" style="display:none">
        <div class="card" style="text-align:center">
            <h2>お疲れ様でした！</h2>
            <div class="rating-input" style="margin:20px 0;">
                <span onclick="setRating(1)" class="star">🔥</span><span onclick="setRating(2)" class="star">🔥</span><span onclick="setRating(3)" class="star">🔥</span><span onclick="setRating(4)" class="star">🔥</span><span onclick="setRating(5)" class="star">🔥</span>
            </div>
            <textarea id="session-memo" placeholder="感想を入力（固定サイズ）"></textarea>
            <button class="btn-primary" style="margin-top:20px;" onclick="saveSessionRecord()">保存して戻る</button>
        </div>
    </section>

    <section id="report-screen" class="screen" style="display:none">
        <div class="card">
            <h2>📊 レポート履歴</h2>
            <div id="memo-list"></div>
            <button class="btn-primary" onclick="showScreen('welcome-screen')">ホームへ</button>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
