    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        // 開発環境と共通のFirebaseコンフィグ
        const firebaseConfig = {
            apiKey: "AIzaSyCdFdzVaqfdHPEQH-iS-ufcV629EMt6k6g", 
            authDomain: "en-ka1.firebaseapp.com",
            projectId: "en-ka1", 
            storageBucket: "en-ka1.firebasestorage.app",
            messagingSenderId: "390713740088", 
            appId: "1:390713740088:web:139bde844b5bedb1218fcd"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        // script.jsから参照できるようにグローバル展開
        window.db = db; 
        window.auth = auth;
        window.dbMethods = { collection, getDocs, query, where };

        // ログイン状態に応じてUIを更新
        onAuthStateChanged(auth, (user) => {
            const userStatusEl = document.getElementById('user-status');
            const avatarTextEl = document.getElementById('profile-avatar-text');
            
            if (user) {
                if(userStatusEl) userStatusEl.innerText = user.displayName;
                if(avatarTextEl) avatarTextEl.innerText = user.displayName.charAt(0);
                loadProfileStats(user.uid); // 実績をロード
            } else {
                if(userStatusEl) userStatusEl.innerText = "ゲスト";
                if(avatarTextEl) avatarTextEl.innerText = "客";
                loadProfileStats(null); // ゲスト用表示
            }
        });
    </script>

<script src="script.js"></script>

<script>
    /**
     * Firebaseからユーザーのセッション履歴を取得し、
     * 累計回数と満足度の平均を計算して表示する関数
     */
    async function loadProfileStats(uid) {
        const countEl = document.getElementById('stat-count');
        const rateEl = document.getElementById('stat-rate');
        
        // ログインしていない場合は0を表示
        if (!uid) {
            if(countEl) countEl.innerText = "0回";
            if(rateEl) rateEl.innerText = "0.0";
            return;
        }
        
        try {
            // Firebaseから自分のIDに紐づくデータを全取得
            const q = window.dbMethods.query(
                window.dbMethods.collection(window.db, "sessions"), 
                window.dbMethods.where("uid", "==", uid)
            );
            const snap = await window.dbMethods.getDocs(q);
            
            let totalRating = 0;
            let sessionCount = 0;
            
            snap.forEach(doc => {
                const data = doc.data();
                if (data.rating) {
                    totalRating += data.rating;
                    sessionCount++;
                }
            });
            
            // UIに数値を反映
            if(countEl) countEl.innerText = sessionCount + "回";
            if(rateEl) {
                const average = sessionCount > 0 ? (totalRating / sessionCount).toFixed(1) : "0.0";
                rateEl.innerText = average;
            }
        } catch(e) {
            console.error("実績の取得に失敗しました:", e);
            if(countEl) countEl.innerText = "Error";
        }
    }

    /**
     * ログアウト処理のラッパー
     */
    async function handleLogout() {
        try {
            await window.auth.signOut();
            location.href = "index.html"; // ログアウト後はホームへ
        } catch (e) {
            console.error("ログアウトエラー:", e);
        }
    }
</script>
